<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scherer - iPad Granular Studio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-export: #10b981;
      --accent-export-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.8rem;
    }

    p {
      color: var(--text-muted);
      margin: 0.4rem 0 0 0;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: var(--border);
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .badge.active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-export);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: 2px dashed var(--border);
      padding: 2rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .file-input-wrapper:active {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .canvas-container {
      position: relative;
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    canvas {
      width: 100%;
      height: 160px;
      background-color: #0b1120;
      cursor: crosshair;
      display: block;
      touch-action: none;
    }

    .selection-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.8rem;
    }

    .btn {
      background-color: var(--accent);
      color: var(--bg-color);
      font-weight: bold;
      border: none;
      padding: 0.8rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-export { background-color: var(--accent-export); }
    .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; }

    .btn:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .control-group h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 32px; /* Taller for easier iPad tapping */
      margin: 0;
    }

    select, input[type="number"] {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .value-display { color: var(--accent); font-family: monospace; font-size: 0.95rem; }

    .transport-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .export-wrapper {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-left: 1px solid var(--border);
      padding-left: 1rem;
    }

    .status {
      text-align: center;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 1rem;
      padding: 0.5rem;
      background: var(--bg-color);
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Scherer WAV Studio</h1>
    <p>Granular Time-Stretcher & Ambient Sound Engine</p>
    <div id="audioStatusBadge" class="badge">Audio Engine: Standby</div>
  </header>

  <div class="card">
    <label class="file-input-wrapper" id="fileWrapper" for="audioFile">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      <span id="fileLabel">Tap to Select WAV/MP3 File</span>
      <input type="file" id="audioFile" accept="audio/*">
    </label>
    
    <div class="canvas-container">
      <canvas id="waveformCanvas"></canvas>
    </div>
    
    <div class="selection-info">
      <span id="selectionText">Selection: Entire Sample (0.00s)</span>
      <button class="btn btn-small" id="resetSelectionBtn" disabled>Reset Selection</button>
    </div>
  </div>

  <div class="card grid">
    <div class="control-group">
      <h3>Global Settings</h3>
      <label>Master Volume <span id="volVal" class="value-display">80%</span></label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">

      <label>Global Pitch <span id="pitchVal" class="value-display">1.00x</span></label>
      <input type="range" id="pitch" min="0.25" max="2.0" step="0.01" value="1.0">
      
      <label>Engine Mode</label>
      <select id="engineMode">
        <option value="granular" selected>Granular Stretch</option>
        <option value="standard">Standard Playback</option>
      </select>
    </div>

    <div class="control-group">
      <h3>Scherer Engine</h3>
      <label>Grain Size <span id="grainVal" class="value-display">40ms</span></label>
      <input type="range" id="grainSize" min="0.01" max="0.15" step="0.005" value="0.04">

      <label>Position Spray <span id="sprayVal" class="value-display">10ms</span></label>
      <input type="range" id="spray" min="0" max="0.1" step="0.005" value="0.01">

      <label>Stretch Factor <span id="stretchVal" class="value-display">4.0x</span></label>
      <input type="range" id="stretch" min="0.5" max="10.0" step="0.1" value="4.0">

      <label>Pitch Jitter <span id="jitterVal" class="value-display">0.02</span></label>
      <input type="range" id="jitter" min="0" max="0.1" step="0.005" value="0.02">
    </div>
  </div>

  <div class="card">
    <div class="transport-controls">
      <button class="btn" id="playBtn" disabled>Play</button>
      <button class="btn" id="stopBtn" disabled style="background-color: var(--danger);">Stop</button>
      
      <div class="export-wrapper">
        <label style="margin: 0; font-weight: normal; color: var(--text-muted); gap: 0.5rem;">
          Export (s): 
          <input type="number" id="exportDuration" value="15" min="1" max="600" style="width: 60px;">
        </label>
        <button class="btn btn-export" id="exportBtn" disabled>Export WAV</button>
      </div>
    </div>
    <div id="status" class="status">Please select an audio file to begin.</div>
  </div>
</div>

<script>
  // Block Double-Tap Zoom on iOS
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) { e.preventDefault(); }
    lastTouchEnd = now;
  }, { passive: false });

  // Web Audio Variables
  let audioCtx = null;
  let audioBuffer = null;
  let masterGain = null;
  let standardSource = null;
  let isPlaying = false;
  let isAudioUnlocked = false;
  
  // Scheduler Variables
  let schedulerId = null;
  let nextGrainTime = 0;
  let currentPosition = 0;
  const LOOKAHEAD = 0.15; // 150ms

  // Selection states (seconds)
  let selectionStart = 0;
  let selectionEnd = 0;
  let isSelecting = false;
  let selectionAnchor = 0;

  // UI Elements
  const ui = {
    fileInput: document.getElementById('audioFile'),
    fileLabel: document.getElementById('fileLabel'),
    playBtn: document.getElementById('playBtn'),
    stopBtn: document.getElementById('stopBtn'),
    exportBtn: document.getElementById('exportBtn'),
    resetBtn: document.getElementById('resetSelectionBtn'),
    status: document.getElementById('status'),
    badge: document.getElementById('audioStatusBadge'),
    canvas: document.getElementById('waveformCanvas'),
    ctx: document.getElementById('waveformCanvas').getContext('2d'),
    selectionText: document.getElementById('selectionText'),
    exportDur: document.getElementById('exportDuration')
  };

  // Sliders & Displays
  const controls = {
    volume: { el: document.getElementById('volume'), val: document.getElementById('volVal'), format: v => `${Math.round(v * 100)}%` },
    pitch: { el: document.getElementById('pitch'), val: document.getElementById('pitchVal'), format: v => `${parseFloat(v).toFixed(2)}x` },
    grainSize: { el: document.getElementById('grainSize'), val: document.getElementById('grainVal'), format: v => `${Math.round(v * 1000)}ms` },
    spray: { el: document.getElementById('spray'), val: document.getElementById('sprayVal'), format: v => `${Math.round(v * 1000)}ms` },
    stretch: { el: document.getElementById('stretch'), val: document.getElementById('stretchVal'), format: v => `${parseFloat(v).toFixed(1)}x` },
    jitter: { el: document.getElementById('jitter'), val: document.getElementById('jitterVal'), format: v => parseFloat(v).toFixed(3) },
    mode: { el: document.getElementById('engineMode') }
  };

  // Bind UI Controls
  Object.keys(controls).forEach(key => {
    if (key === 'mode') return;
    controls[key].el.addEventListener('input', (e) => {
      controls[key].val.textContent = controls[key].format(e.target.value);
      if (key === 'volume' && masterGain) {
        masterGain.gain.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05);
      }
    });
  });

  // Bulletproof iOS Audio Unlocker
  function initAudioEngine() {
    if (isAudioUnlocked) return;
    
    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) {
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(controls.volume.el.value);
      masterGain.connect(audioCtx.destination);
    }

    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    // Force hardware pipeline open with a silent oscillator
    const osc = audioCtx.createOscillator();
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    osc.connect(silentGain);
    silentGain.connect(audioCtx.destination);
    osc.start(0);
    osc.stop(audioCtx.currentTime + 0.01);

    isAudioUnlocked = true;
    ui.badge.textContent = "Audio Engine: Active";
    ui.badge.classList.add('active');
  }

  // Bind Unlocker to global touch/click events (runs once)
  ['touchstart', 'touchend', 'mousedown', 'click'].forEach(evt => {
    document.body.addEventListener(evt, initAudioEngine, { once: true });
  });

  // Waveform Rendering
  function drawWaveform() {
    if (!audioBuffer) return;
    const width = ui.canvas.width = ui.canvas.clientWidth * window.devicePixelRatio;
    const height = ui.canvas.height = ui.canvas.clientHeight * window.devicePixelRatio;
    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ui.ctx.fillStyle = '#0b1120';
    ui.ctx.fillRect(0, 0, width, height);

    // Selection Highlight
    if (selectionStart > 0 || selectionEnd < audioBuffer.duration) {
      const xStart = (selectionStart / audioBuffer.duration) * width;
      const xEnd = (selectionEnd / audioBuffer.duration) * width;
      ui.ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ui.ctx.fillRect(xStart, 0, Math.max(2, xEnd - xStart), height);
    }

    // Waveform
    ui.ctx.beginPath();
    ui.ctx.strokeStyle = '#38bdf8';
    ui.ctx.lineWidth = window.devicePixelRatio;

    for (let i = 0; i < width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum < min) min = datum;
        if (datum > max) max = datum;
      }
      ui.ctx.moveTo(i, (1 + min) * amp);
      ui.ctx.lineTo(i, (1 + max) * amp);
    }
    ui.ctx.stroke();
  }

  // Playhead Animation
  function updatePlayhead() {
    if (!isPlaying || !audioBuffer) return;
    drawWaveform();
    const width = ui.canvas.width;
    const height = ui.canvas.height;
    const x = (currentPosition / audioBuffer.duration) * width;

    ui.ctx.strokeStyle = 'var(--danger)';
    ui.ctx.lineWidth = 2 * window.devicePixelRatio;
    ui.ctx.beginPath();
    ui.ctx.moveTo(x, 0);
    ui.ctx.lineTo(x, height);
    ui.ctx.stroke();

    if (isPlaying) requestAnimationFrame(updatePlayhead);
  }

  // Touch/Mouse Selection Logic
  function getPosFromEvent(e) {
    const rect = ui.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    return (x / rect.width) * audioBuffer.duration;
  }

  function handleStart(e) {
    if (!audioBuffer) return;
    initAudioEngine();
    isSelecting = true;
    selectionAnchor = getPosFromEvent(e);
    selectionStart = selectionAnchor;
    selectionEnd = selectionAnchor;
    updateSelectionUI();
    drawWaveform();
  }

  function handleMove(e) {
    if (!isSelecting || !audioBuffer) return;
    const currentPos = getPosFromEvent(e);
    selectionStart = Math.min(selectionAnchor, currentPos);
    selectionEnd = Math.max(selectionAnchor, currentPos);
    updateSelectionUI();
    drawWaveform();
  }

  function handleEnd() {
    if (!isSelecting) return;
    isSelecting = false;
    if (Math.abs(selectionEnd - selectionStart) < 0.05) {
      resetSelection();
    } else {
      currentPosition = selectionStart;
    }
  }

  ui.canvas.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);
  ui.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
  window.addEventListener('touchmove', (e) => { if (isSelecting) { e.preventDefault(); handleMove(e); } }, { passive: false });
  window.addEventListener('touchend', handleEnd);

  function resetSelection() {
    if (!audioBuffer) return;
    selectionStart = 0;
    selectionEnd = audioBuffer.duration;
    currentPosition = 0;
    updateSelectionUI();
    drawWaveform();
  }

  ui.resetBtn.addEventListener('click', resetSelection);
  ui.resetBtn.addEventListener('touchend', (e) => { e.preventDefault(); resetSelection(); });

  function updateSelectionUI() {
    if (!audioBuffer) return;
    const isFull = (selectionStart === 0 && selectionEnd === audioBuffer.duration);
    if (isFull) {
      ui.selectionText.textContent = `Selection: Entire Sample (${audioBuffer.duration.toFixed(2)}s)`;
      ui.resetBtn.disabled = true;
    } else {
      ui.selectionText.textContent = `Selection: ${selectionStart.toFixed(2)}s - ${selectionEnd.toFixed(2)}s`;
      ui.resetBtn.disabled = false;
    }
  }

  // File Upload (Using legacy callback for strict iOS Safari compatibility)
  ui.fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    initAudioEngine();
    ui.fileLabel.textContent = file.name;
    ui.status.textContent = "Decoding audio file...";

    const reader = new FileReader();
    reader.onload = (evt) => {
      const arrayBuffer = evt.target.result;
      audioCtx.decodeAudioData(arrayBuffer, 
        (buffer) => {
          audioBuffer = buffer;
          ui.status.textContent = `Loaded: ${file.name} | Duration: ${audioBuffer.duration.toFixed(2)}s`;
          ui.playBtn.disabled = false;
          ui.stopBtn.disabled = false;
          ui.exportBtn.disabled = false;
          resetSelection();
        },
        (error) => {
          ui.status.textContent = "Error decoding audio. Try a standard WAV/MP3 file.";
          console.error(error);
        }
      );
    };
    reader.readAsArrayBuffer(file);
  });

  // Play / Stop
  ui.playBtn.onclick = () => {
    if (!audioBuffer) return;
    initAudioEngine();
    stopAudio();
    
    isPlaying = true;
    ui.status.textContent = "Playing...";

    if (controls.mode.el.value === 'standard') {
      playStandard();
    } else {
      if (currentPosition < selectionStart || currentPosition >= selectionEnd) {
        currentPosition = selectionStart;
      }
      nextGrainTime = audioCtx.currentTime + 0.05;
      schedulerLoop();
      requestAnimationFrame(updatePlayhead);
    }
  };

  ui.stopBtn.onclick = () => {
    stopAudio();
    ui.status.textContent = "Stopped.";
    drawWaveform();
  };

  function stopAudio() {
    isPlaying = false;
    if (standardSource) { try { standardSource.stop(); } catch(e){} standardSource = null; }
    if (schedulerId) { cancelAnimationFrame(schedulerId); schedulerId = null; }
  }

  function playStandard() {
    standardSource = audioCtx.createBufferSource();
    standardSource.buffer = audioBuffer;
    standardSource.playbackRate.value = parseFloat(controls.pitch.el.value);
    standardSource.loop = true;
    standardSource.loopStart = selectionStart;
    standardSource.loopEnd = selectionEnd;
    standardSource.connect(masterGain);
    standardSource.start(0, selectionStart);
    
    // Playhead logic for standard playback
    let startTime = audioCtx.currentTime;
    let startPos = selectionStart;
    
    function trackStandard() {
      if (!isPlaying || controls.mode.el.value !== 'standard') return;
      let elapsed = (audioCtx.currentTime - startTime) * parseFloat(controls.pitch.el.value);
      let loopDuration = selectionEnd - selectionStart;
      currentPosition = startPos + (elapsed % loopDuration);
      updatePlayhead();
      requestAnimationFrame(trackStandard);
    }
    requestAnimationFrame(trackStandard);
  }

  // requestAnimationFrame Granular Scheduler (Highly reliable on iOS)
  function schedulerLoop() {
    if (!isPlaying) return;

    // Failsafe: If browser suspended tab, fast-forward time
    if (nextGrainTime < audioCtx.currentTime) {
      nextGrainTime = audioCtx.currentTime + 0.05;
    }

    while (nextGrainTime < audioCtx.currentTime + LOOKAHEAD) {
      scheduleNextGrain(nextGrainTime);
    }
    schedulerId = requestAnimationFrame(schedulerLoop);
  }

  function scheduleNextGrain(startTime) {
    const dur = parseFloat(controls.grainSize.el.value);
    const spray = parseFloat(controls.spray.el.value);
    const stretch = parseFloat(controls.stretch.el.value);
    const basePitch = parseFloat(controls.pitch.el.value);
    const jitter = parseFloat(controls.jitter.el.value);

    let readPos = currentPosition + ((Math.random() - 0.5) * spray);
    if (readPos < selectionStart) readPos = selectionStart;
    if (readPos >= selectionEnd - dur) {
      readPos = selectionStart;
      currentPosition = selectionStart;
    }

    const pitch = Math.max(0.05, basePitch + ((Math.random() - 0.5) * jitter));
    spawnGrain(startTime, readPos, dur, pitch);

    const hopSize = dur / stretch;
    currentPosition += hopSize / 2;
    nextGrainTime += hopSize / 2;
  }

  function spawnGrain(startTime, offset, duration, pitchRate) {
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = pitchRate;

    const env = audioCtx.createGain();
    
    // Linear ramping to prevent iOS clipping/clicking
    env.gain.setValueAtTime(0, startTime);
    env.gain.linearRampToValueAtTime(1.0, startTime + (duration * 0.5));
    env.gain.linearRampToValueAtTime(0, startTime + duration);

    source.connect(env);
    env.connect(masterGain);

    source.start(startTime, offset, duration);
    source.stop(startTime + duration + 0.05);
  }

  // Offline WAV Export
  ui.exportBtn.onclick = async () => {
    if (!audioBuffer) return;
    initAudioEngine();

    const expDur = Math.max(1, parseFloat(ui.exportDur.value) || 15);
    ui.status.textContent = `Rendering ${expDur}s WAV file...`;

    const sampleRate = audioBuffer.sampleRate || 44100;
    const offlineCtx = new OfflineAudioContext(2, sampleRate * expDur, sampleRate);
    
    const renderGain = offlineCtx.createGain();
    renderGain.gain.value = parseFloat(controls.volume.el.value);
    renderGain.connect(offlineCtx.destination);

    let renderPos = selectionStart;
    const dur = parseFloat(controls.grainSize.el.value);
    const spray = parseFloat(controls.spray.el.value);
    const stretch = parseFloat(controls.stretch.el.value);
    const basePitch = parseFloat(controls.pitch.el.value);
    const jitter = parseFloat(controls.jitter.el.value);
    const hopSize = dur / stretch;

    for (let time = 0; time < expDur; time += hopSize / 2) {
      let readPos = renderPos + ((Math.random() - 0.5) * spray);
      if (readPos < selectionStart) readPos = selectionStart;
      if (readPos >= selectionEnd - dur) { readPos = selectionStart; renderPos = selectionStart; }

      const pitch = Math.max(0.05, basePitch + ((Math.random() - 0.5) * jitter));
      
      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.playbackRate.value = pitch;

      const env = offlineCtx.createGain();
      env.gain.setValueAtTime(0, time);
      env.gain.linearRampToValueAtTime(1.0, time + (dur * 0.5));
      env.gain.linearRampToValueAtTime(0, time + dur);

      source.connect(env);
      env.connect(renderGain);

      source.start(time, readPos, dur);
      source.stop(time + dur + 0.05);

      renderPos += hopSize / 2;
    }

    try {
      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Scherer_Export_${expDur}s.wav`;
      a.click();
      ui.status.textContent = "Export complete! File downloaded.";
    } catch (e) {
      ui.status.textContent = "Export failed. File may be too long.";
    }
  };

  // Binary WAV Encoder
  function bufferToWave(abuffer, len) {
    let numOfChan = abuffer.numberOfChannels,
        length = len * numOfChan * 2 + 44,
        buffer = new ArrayBuffer(length),
        view = new DataView(buffer),
        channels = [], i, sample,
        offset = 0, pos = 0;

    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt " chunk
    setUint32(16);
    setUint16(1); // PCM
    setUint16(numOfChan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data" chunk
    setUint32(length - pos - 4);

    for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

    while(offset < len) {
      for(i = 0; i < numOfChan; i++) {
        sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
        view.setInt16(pos, sample, true);
        pos += 2;
      }
      offset++;
    }
    return new Blob([buffer], {type: "audio/wav"});
  }
