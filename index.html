<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scherer - Granular Studio & Exporter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-export: #10b981;
      --accent-export-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 2rem;
    }

    p {
      color: var(--text-muted);
      margin: 0.5rem 0 0 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      border: 2px dashed var(--border);
      padding: 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .file-input-wrapper:hover {
      border-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .canvas-container {
      position: relative;
      margin-top: 1rem;
    }

    canvas {
      width: 100%;
      height: 140px;
      background-color: #0b1120;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: crosshair;
      display: block;
    }

    .selection-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .btn {
      background-color: var(--accent);
      color: var(--bg-color);
      font-weight: bold;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-export {
      background-color: var(--accent-export);
      color: #000;
    }

    .btn-export:hover {
      background-color: var(--accent-export-hover);
    }

    .btn-small {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }

    .btn:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"] {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem;
      border-radius: 4px;
      width: 80px;
    }

    .value-display {
      color: var(--accent);
    }

    .transport-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .export-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-left: 1px solid var(--border);
      padding-left: 1rem;
    }

    .status {
      text-align: center;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Scherer WAV Studio</h1>
    <p>Granular Time-Stretcher & Ambient Sound Design Engine</p>
  </header>

  <div class="card">
    <label class="file-input-wrapper" for="audioFile">
      <span id="fileLabel">Click or Drag & Drop a WAV file here</span>
      <input type="file" id="audioFile" accept="audio/wav, audio/x-wav">
    </label>
    
    <div class="canvas-container">
      <canvas id="waveformCanvas"></canvas>
    </div>
    
    <div class="selection-info">
      <span id="selectionText">Selection: Entire Sample (0.00s - 0.00s)</span>
      <button class="btn btn-small" id="resetSelectionBtn" disabled>Reset Selection</button>
    </div>
  </div>

  <div class="card grid">
    <div class="control-group">
      <h3>Global & Effects</h3>
      <label>Master Volume <span id="volVal" class="value-display">80%</span></label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">

      <label>Global Pitch <span id="pitchVal" class="value-display">1.0x</span></label>
      <input type="range" id="pitch" min="0.25" max="2.0" step="0.01" value="1.0">

      <label>Ambient Reverb Wet <span id="reverbVal" class="value-display">20%</span></label>
      <input type="range" id="reverb" min="0" max="0.8" step="0.01" value="0.2">
    </div>

    <div class="control-group">
      <h3>Scherer Engine (Granular)</h3>
      <label>Engine Mode</label>
      <select id="engineMode" style="padding: 0.5rem; border-radius: 4px; background: var(--bg-color); color: var(--text); border: 1px solid var(--border);">
        <option value="granular" selected>Granular Stretch</option>
        <option value="standard">Standard Playback</option>
      </select>

      <label>Grain Size <span id="grainVal" class="value-display">30ms</span></label>
      <input type="range" id="grainSize" min="0.01" max="0.1" step="0.005" value="0.03">

      <label>Position Spray <span id="sprayVal" class="value-display">10ms</span></label>
      <input type="range" id="spray" min="0" max="0.1" step="0.005" value="0.01">

      <label>Stretch Factor <span id="stretchVal" class="value-display">4.0x</span></label>
      <input type="range" id="stretch" min="0.5" max="10.0" step="0.1" value="4.0">

      <label>Stereo Spread <span id="spreadVal" class="value-display">50%</span></label>
      <input type="range" id="spread" min="0" max="1" step="0.05" value="0.5">

      <label>Pitch Jitter <span id="jitterVal" class="value-display">0.02</span></label>
      <input type="range" id="jitter" min="0" max="0.1" step="0.005" value="0.02">
    </div>
  </div>

  <div class="card">
    <div class="transport-controls">
      <button class="btn" id="playBtn" disabled>Play</button>
      <button class="btn" id="stopBtn" disabled>Stop</button>
      
      <div class="export-wrapper">
        <label style="margin: 0; font-weight: normal;">
          Length (s): 
          <input type="number" id="exportDuration" value="15" min="1" max="600">
        </label>
        <button class="btn btn-export" id="exportBtn" disabled>Export WAV</button>
      </div>
    </div>
    <p id="status" class="status">Please load a WAV file to start.</p>
  </div>
</div>

<script>
  let audioCtx = null, audioBuffer = null, standardSource = null, isPlaying = false;
  let mainGain, delayNode, feedbackGain;
  let grainTimer = null, currentPosition = 0;

  // Selection states (in seconds)
  let selectionStart = 0;
  let selectionEnd = 0;
  let isSelecting = false;
  let dragStartX = 0;

  // UI Elements
  const fileInput = document.getElementById('audioFile');
  const fileLabel = document.getElementById('fileLabel');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const exportBtn = document.getElementById('exportBtn');
  const resetSelectionBtn = document.getElementById('resetSelectionBtn');
  const selectionText = document.getElementById('selectionText');
  const exportDurationInput = document.getElementById('exportDuration');
  const status = document.getElementById('status');
  const canvas = document.getElementById('waveformCanvas');
  const canvasCtx = canvas.getContext('2d');

  // Sliders
  const volumeSlider = document.getElementById('volume');
  const pitchSlider = document.getElementById('pitch');
  const reverbSlider = document.getElementById('reverb');
  const grainSizeSlider = document.getElementById('grainSize');
  const spraySlider = document.getElementById('spray');
  const stretchSlider = document.getElementById('stretch');
  const spreadSlider = document.getElementById('spread');
  const jitterSlider = document.getElementById('jitter');
  const engineModeSelect = document.getElementById('engineMode');

  // Value Displays
  const volVal = document.getElementById('volVal');
  const pitchVal = document.getElementById('pitchVal');
  const reverbVal = document.getElementById('reverbVal');
  const grainVal = document.getElementById('grainVal');
  const sprayVal = document.getElementById('sprayVal');
  const stretchVal = document.getElementById('stretchVal');
  const spreadVal = document.getElementById('spreadVal');
  const jitterVal = document.getElementById('jitterVal');

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      mainGain = audioCtx.createGain();
      mainGain.gain.value = parseFloat(volumeSlider.value);

      delayNode = audioCtx.createDelay();
      delayNode.delayTime.value = 0.25; 
      feedbackGain = audioCtx.createGain();
      feedbackGain.gain.value = parseFloat(reverbSlider.value);

      // Connect Nodes cleanly
      mainGain.connect(audioCtx.destination);
      mainGain.connect(delayNode);
      delayNode.connect(feedbackGain);
      feedbackGain.connect(delayNode);
      delayNode.connect(audioCtx.destination);
    }
  }

  // Draw Audio Waveform & Active Selection
  function drawWaveform() {
    if (!audioBuffer) return;
    const width = canvas.width = canvas.clientWidth * window.devicePixelRatio;
    const height = canvas.height = canvas.clientHeight * window.devicePixelRatio;

    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    canvasCtx.fillStyle = '#0b1120';
    canvasCtx.fillRect(0, 0, width, height);

    // Draw Selection Highlight
    if (selectionStart !== 0 || selectionEnd !== audioBuffer.duration) {
      const xStart = (selectionStart / audioBuffer.duration) * width;
      const xEnd = (selectionEnd / audioBuffer.duration) * width;
      canvasCtx.fillStyle = 'rgba(56, 189, 248, 0.2)';
      canvasCtx.fillRect(xStart, 0, xEnd - xStart, height);
    }

    // Draw Waveform Lines
    canvasCtx.beginPath();
    canvasCtx.strokeStyle = '#38bdf8';
    canvasCtx.lineWidth = 1;

    for (let i = 0; i < width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum < min) min = datum;
        if (datum > max) max = datum;
      }
      canvasCtx.moveTo(i, (1 + min) * amp);
      canvasCtx.lineTo(i, (1 + max) * amp);
    }
    canvasCtx.stroke();
  }

  // Visual Playhead Animation
  function updatePlayhead() {
    if (!isPlaying || !audioBuffer) return;
    drawWaveform();
    const width = canvas.width;
    const height = canvas.height;
    const x = (currentPosition / audioBuffer.duration) * width;

    // Draw active playhead line
    canvasCtx.strokeStyle = '#ef4444';
    canvasCtx.lineWidth = 2;
    canvasCtx.beginPath();
    canvasCtx.moveTo(x, 0);
    canvasCtx.lineTo(x, height);
    canvasCtx.stroke();

    requestAnimationFrame(updatePlayhead);
  }

  // Canvas Mouse Selection Handling
  canvas.addEventListener('mousedown', (e) => {
    if (!audioBuffer) return;
    isSelecting = true;
    const rect = canvas.getBoundingClientRect();
    dragStartX = e.clientX - rect.left;
    const pct = dragStartX / rect.width;
    selectionStart = pct * audioBuffer.duration;
    selectionEnd = selectionStart;
    updateSelectionUI();
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isSelecting || !audioBuffer) return;
    const rect = canvas.getBoundingClientRect();
    const currentX = e.clientX - rect.left;
    const pct = Math.max(0, Math.min(1, currentX / rect.width));
    const currentPos = pct * audioBuffer.duration;

    if (currentPos >= selectionStart) {
      selectionEnd = currentPos;
    } else {
      selectionEnd = selectionStart;
      selectionStart = currentPos;
    }
    updateSelectionUI();
    drawWaveform();
  });

  window.addEventListener('mouseup', () => {
    if (isSelecting) {
      isSelecting = false;
      // If drag was negligible, reset to full range or position set
      if (Math.abs(selectionEnd - selectionStart) < 0.05) {
        resetSelection();
      } else {
        currentPosition = selectionStart;
      }
    }
  });

  resetSelectionBtn.onclick = () => resetSelection();

  function resetSelection() {
    if (!audioBuffer) return;
    selectionStart = 0;
    selectionEnd = audioBuffer.duration;
    currentPosition = 0;
    updateSelectionUI();
    drawWaveform();
  }

  function updateSelectionUI() {
    if (!audioBuffer) return;
    const isFull = (selectionStart === 0 && selectionEnd === audioBuffer.duration);
    if (isFull) {
      selectionText.textContent = `Selection: Entire Sample (${audioBuffer.duration.toFixed(2)}s)`;
    } else {
      selectionText.textContent = `Selection: ${selectionStart.toFixed(2)}s - ${selectionEnd.toFixed(2)}s (${(selectionEnd - selectionStart).toFixed(2)}s range)`;
    }
    resetSelectionBtn.disabled = isFull;
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    initAudio();
    fileLabel.textContent = file.name;
    status.textContent = "Decoding WAV audio file...";

    const arrayBuffer = await file.arrayBuffer();
    try {
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      status.textContent = `Loaded: ${file.name} | Duration: ${audioBuffer.duration.toFixed(2)}s`;
      playBtn.disabled = false;
      stopBtn.disabled = false;
      exportBtn.disabled = false;
      resetSelection();
    } catch (err) {
      status.textContent = "Error decoding WAV file.";
    }
  });

  // UI Event Listeners
  volumeSlider.oninput = (e) => { volVal.textContent = `${Math.round(e.target.value * 100)}%`; if (mainGain) mainGain.gain.value = e.target.value; };
  pitchSlider.oninput = (e) => { pitchVal.textContent = `${parseFloat(e.target.value).toFixed(2)}x`; };
  reverbSlider.oninput = (e) => { reverbVal.textContent = `${Math.round(e.target.value * 100)}%`; if (feedbackGain) feedbackGain.gain.value = e.target.value; };
  grainSizeSlider.oninput = (e) => grainVal.textContent = `${Math.round(e.target.value * 1000)}ms`;
  spraySlider.oninput = (e) => sprayVal.textContent = `${Math.round(e.target.value * 1000)}ms`;
  stretchSlider.oninput = (e) => stretchVal.textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
  spreadSlider.oninput = (e) => spreadVal.textContent = `${Math.round(e.target.value * 100)}%`;
  jitterSlider.oninput = (e) => jitterVal.textContent = parseFloat(e.target.value).toFixed(3);

  playBtn.onclick = async () => {
    if (!audioBuffer) return;
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    stopAudio();
    isPlaying = true;

    if (engineModeSelect.value === 'standard') {
      playStandard();
    } else {
      if (currentPosition < selectionStart || currentPosition >= selectionEnd) {
        currentPosition = selectionStart;
      }
      playGranular();
      requestAnimationFrame(updatePlayhead);
    }
    status.textContent = "Playing...";
  };

  stopBtn.onclick = () => {
    stopAudio();
    status.textContent = "Stopped.";
    drawWaveform();
  };

  function stopAudio() {
    isPlaying = false;
    if (standardSource) { standardSource.stop(); standardSource = null; }
    if (grainTimer) { clearTimeout(grainTimer); grainTimer = null; }
  }

  function playStandard() {
    standardSource = audioCtx.createBufferSource();
    standardSource.buffer = audioBuffer;
    standardSource.playbackRate.value = parseFloat(pitchSlider.value);
    standardSource.loop = true;
    standardSource.loopStart = selectionStart;
    standardSource.loopEnd = selectionEnd;
    standardSource.connect(mainGain);
    standardSource.start(0, selectionStart);
  }

  function playGranular() {
    if (!isPlaying) return;

    const grainDuration = parseFloat(grainSizeSlider.value);
    const spray = parseFloat(spraySlider.value);
    const stretch = parseFloat(stretchSlider.value);
    const basePitch = parseFloat(pitchSlider.value);
    const jitter = parseFloat(jitterSlider.value);
    const spread = parseFloat(spreadSlider.value);

    const randomOffset = (Math.random() - 0.5) * spray;
    let readPos = currentPosition + randomOffset;

    // Constrain position within selection
    if (readPos < selectionStart) readPos = selectionStart;
    if (readPos >= selectionEnd - grainDuration) {
      readPos = selectionStart;
      currentPosition = selectionStart;
    }

    const pitch = Math.max(0.05, basePitch + (Math.random() - 0.5) * jitter);
    const pan = (Math.random() - 0.5) * 2 * spread;

    spawnGrain(readPos, grainDuration, pitch, pan, audioCtx, mainGain);

    const hopSize = grainDuration / stretch;
    currentPosition += hopSize / 2;

    grainTimer = setTimeout(playGranular, (hopSize / 2) * 1000);
  }

  function spawnGrain(offset, duration, pitchRate, panVal, ctx, destination) {
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.playbackRate.value = pitchRate;

    const env = ctx.createGain();
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const now = ctx.currentTime;

    // Soft Envelope to avoid clicks
    env.gain.setValueAtTime(0.0001, now);
    env.gain.linearRampToValueAtTime(0.8, now + duration / 2);
    env.gain.linearRampToValueAtTime(0.0001, now + duration);

    source.connect(env);
    if (panner) {
      panner.pan.value = panVal;
      env.connect(panner);
      panner.connect(destination);
    } else {
      env.connect(destination);
    }

    source.start(now, offset, duration);
    source.stop(now + duration + 0.01);
  }

  // --- WAV EXPORTER ---
  exportBtn.onclick = async () => {
    if (!audioBuffer) return;
    const exportDuration = Math.max(1, parseFloat(exportDurationInput.value) || 15);
    status.textContent = `Rendering ${exportDuration}-second WAV export...`;

    const sampleRate = 44100;
    const offlineCtx = new OfflineAudioContext(2, sampleRate * exportDuration, sampleRate);
    const renderGain = offlineCtx.createGain();
    renderGain.gain.value = parseFloat(volumeSlider.value);
    renderGain.connect(offlineCtx.destination);

    let renderPos = selectionStart;
    const grainDuration = parseFloat(grainSizeSlider.value);
    const spray = parseFloat(spraySlider.value);
    const stretch = parseFloat(stretchSlider.value);
    const basePitch = parseFloat(pitchSlider.value);
    const jitter = parseFloat(jitterSlider.value);
    const spread = parseFloat(spreadSlider.value);
    const hopSize = grainDuration / stretch;

    for (let time = 0; time < exportDuration; time += hopSize / 2) {
      const randomOffset = (Math.random() - 0.5) * spray;
      let readPos = renderPos + randomOffset;
      
      if (readPos < selectionStart) readPos = selectionStart;
      if (readPos >= selectionEnd - grainDuration) { 
        readPos = selectionStart; 
        renderPos = selectionStart; 
      }

      const pitch = Math.max(0.05, basePitch + (Math.random() - 0.5) * jitter);
      const pan = (Math.random() - 0.5) * 2 * spread;

      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.playbackRate.value = pitch;

      const env = offlineCtx.createGain();
      const panner = offlineCtx.createStereoPanner();

      env.gain.setValueAtTime(0.0001, time);
      env.gain.linearRampToValueAtTime(0.8, time + grainDuration / 2);
      env.gain.linearRampToValueAtTime(0.0001, time + grainDuration);

      source.connect(env);
      panner.pan.value = pan;
      env.connect(panner);
      panner.connect(renderGain);

      source.start(time, readPos, grainDuration);
      source.stop(time + grainDuration + 0.01);

      renderPos += hopSize / 2;
    }

    const renderedBuffer = await offlineCtx.startRendering();
    const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
    
    // Auto-download file
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Scherer_Export_${exportDuration}s.wav`;
    a.click();
    status.textContent = "Export complete! File downloaded.";
  };

  // Convert AudioBuffer to WAV Binary
  function bufferToWave(abuffer, len) {
    let numOfChan = abuffer.numberOfChannels,
        length = len * numOfChan * 2 + 44,
        buffer = new ArrayBuffer(length),
        view = new DataView(buffer),
        channels = [], i, sample,
        offset = 0, pos = 0;

    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt " chunk
    setUint32(16);
    setUint16(1); // PCM
    setUint16(numOfChan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data" chunk
    setUint32(length - pos - 4);

    for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

    while(offset < len) {
      for(i = 0; i < numOfChan; i++) {
        sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
        view.setInt16(pos, sample, true);
        pos += 2;
      }
      offset++;
    }
    return new Blob([buffer], {type: "audio/wav"});
  }
</script>

</body>
</html>
